<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenSynapse</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <header class="titlebar">
      <img class="logo" src="/logo.png" alt="" />
      <span class="wordmark">OPEN<b>SYNAPSE</b></span>
    </header>
    <nav class="rail">
      <button class="nav active" data-view="devices" data-i18n-title="nav.devices">
        <svg viewBox="0 0 24 24"><path d="M12 2a6 6 0 0 0-6 6v8a6 6 0 0 0 12 0V8a6 6 0 0 0-6-6zm0 2v5M6 10h12" /></svg>
        <span data-i18n="nav.devices"></span>
      </button>
      <button class="nav" data-view="scenes" data-i18n-title="nav.scenesTitle">
        <svg viewBox="0 0 24 24"><path d="M12 3 2 8l10 5 10-5-10-5zM2 13l10 5 10-5M2 18l10 5 10-5" /></svg>
        <span data-i18n="nav.scenes"></span>
      </button>
      <button class="nav" data-view="macros" data-i18n-title="nav.macros">
        <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2" /><path d="M7 10h2M11 10h2M15 10h2M7 14h10" /></svg>
        <span data-i18n="nav.macros"></span>
      </button>
      <button class="nav" data-view="settings" data-i18n-title="nav.settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" /><path d="M19.20 9.58L21.85 10.28L21.85 13.72L19.20 14.42L18.81 15.38L20.18 17.75L17.75 20.18L15.38 18.81L14.42 19.20L13.72 21.85L10.28 21.85L9.58 19.20L8.62 18.81L6.25 20.18L3.82 17.75L5.19 15.38L4.80 14.42L2.15 13.72L2.15 10.28L4.80 9.58L5.19 8.62L3.82 6.25L6.25 3.82L8.62 5.19L9.58 4.80L10.28 2.15L13.72 2.15L14.42 4.80L15.38 5.19L17.75 3.82L20.18 6.25L18.81 8.62Z" /></svg>
        <span data-i18n="nav.settings"></span>
      </button>
      <button class="nav" data-view="about" data-i18n-title="nav.about">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M12 11v5M12 8h.01" /></svg>
        <span data-i18n="nav.about"></span>
      </button>
    </nav>

    <main>
      <!-- Device overview -->
      <section id="view-devices" class="view">
        <header class="device-head">
          <div>
            <div class="eyebrow" data-i18n="overview.eyebrow"></div>
            <h1 data-i18n="overview.title"></h1>
          </div>
          <button id="rescan" class="ghost icon" data-i18n-title="overview.rescan">
            <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5" /></svg>
          </button>
        </header>
        <div id="device-grid" class="device-grid"></div>
        <div id="no-device" class="empty" hidden>
          <p data-i18n="overview.none"></p>
          <p class="muted" data-i18n="overview.noneHint"></p>
        </div>
      </section>

      <!-- One device -->
      <section id="view-device" class="view" hidden>
        <button id="back" class="back" data-i18n="device.back"></button>
        <header class="device-head">
          <div>
            <div class="eyebrow" id="dev-cat"></div>
            <h1 id="dev-name"></h1>
          </div>
          <div class="head-right">
            <span id="dev-conn" class="pill"></span>
            <span id="dev-battery" class="pill battery" hidden></span>
          </div>
        </header>

        <div class="tabs">
          <button class="tab" data-tab="perf" data-i18n="tab.perf"></button>
          <button class="tab" data-tab="lighting" data-i18n="tab.lighting"></button>
          <button class="tab" data-tab="power" data-i18n="tab.power"></button>
          <button class="tab" data-tab="receiver" data-i18n="tab.receiver"></button>
          <button class="tab" data-tab="buttons" data-i18n="tab.buttons"></button>
          <button class="tab" data-tab="info" data-i18n="tab.info"></button>
          <button class="tab" data-tab="eq" data-i18n="tab.eq"></button>
          <button class="tab" data-tab="audio" data-i18n="tab.audio"></button>
        </div>

        <div id="tab-perf" class="tab-body">
          <div class="card" id="card-stages">
            <div class="card-head">
              <h2 data-i18n="dpi.title"></h2>
              <span class="muted"><span data-i18n="dpi.current"></span> <b id="cur-dpi" class="accent">—</b> DPI</span>
            </div>
            <p class="muted small" data-i18n="dpi.stagesHint"></p>
            <div id="stages" class="stages"></div>
            <div class="row">
              <button id="add-stage" class="ghost" data-i18n="dpi.addStage"></button>
              <label class="check"><input id="xy-link" type="checkbox" checked /> <span data-i18n="dpi.xyLink"></span></label>
            </div>
          </div>

          <div class="card" id="card-dpi">
            <div class="card-head"><h2 data-i18n="dpi.title"></h2><span class="accent"><b id="dpi-val">—</b> DPI</span></div>
            <input id="dpi" type="range" min="100" step="50" />
          </div>

          <div class="card" id="card-lift" hidden>
            <div class="card-head">
              <h2><span data-i18n="lift.title"></span><span class="info" tabindex="0" data-i18n-title="lift.more">i</span></h2>
              <label class="check"><input id="lift-asym" type="checkbox" /> <span data-i18n="lift.asymmetric"></span></label>
            </div>
            <div id="lift-sym" class="seg"></div>
            <div id="lift-asym-body" class="lift-grid" hidden>
              <label><span class="muted small"><span data-i18n="lift.liftOff"></span> <b id="lift-off-val"></b></span><input id="lift-off" type="range" min="2" max="26" step="1" /></label>
              <label><span class="muted small"><span data-i18n="lift.landing"></span> <b id="lift-land-val"></b></span><input id="lift-land" type="range" min="1" max="25" step="1" /></label>
            </div>
            <div class="row"><span class="muted small" data-i18n="lift.hint"></span><button id="lift-reset" class="ghost" data-i18n="lift.reset"></button></div>
          </div>

          <div class="card" id="card-poll">
            <div class="card-head"><h2 data-i18n="poll.title"></h2><span class="muted small" id="poll-hint"></span></div>
            <div id="poll" class="seg"></div>
          </div>
        </div>

        <div id="tab-lighting" class="tab-body" hidden>
          <div class="card">
            <div class="card-head"><h2 data-i18n="light.effect"></h2></div>
            <div id="effects" class="seg"></div>
            <div id="color-row" class="color-row">
              <span class="muted small" data-i18n="light.color"></span>
              <div id="swatches" class="swatches"></div>
              <input id="color" type="color" data-i18n-title="light.customColor" />
            </div>
          </div>
          <div class="card" id="card-brightness">
            <div class="card-head"><h2 data-i18n="light.brightness"></h2><span class="accent"><b id="bright-val">—</b>%</span></div>
            <input id="brightness" type="range" min="0" max="100" step="5" />
          </div>
        </div>

        <div id="tab-power" class="tab-body" hidden>
          <div class="card battery-card" id="card-battery">
            <div class="battery-big"><span id="bat-num">—</span><small>%</small></div>
            <div class="bat-bar"><i id="bat-fill"></i></div>
            <div class="muted" id="bat-state"></div>
          </div>
          <div class="card" id="card-idle">
            <div class="card-head"><h2 data-i18n="power.sleep"></h2><span class="accent"><b id="idle-val">—</b> <span data-i18n="power.minutes"></span></span></div>
            <p class="muted small" data-i18n="power.sleepHint"></p>
            <input id="idle" type="range" min="1" max="15" step="1" />
          </div>
          <div class="card" id="card-low">
            <div class="card-head"><h2 data-i18n="power.low"></h2><span class="accent"><b id="low-val">—</b>%</span></div>
            <p class="muted small" data-i18n="power.lowHint"></p>
            <input id="low" type="range" min="5" max="30" step="5" />
          </div>
        </div>

        <div id="tab-receiver" class="tab-body" hidden>
          <div class="card">
            <div class="card-head"><h2><span data-i18n="receiver.leds"></span><span class="info" tabindex="0" data-i18n-title="receiver.ledsMore">i</span></h2></div>
            <p class="muted small" data-i18n="receiver.ledsHint"></p>
            <div class="leds">
              <label><span class="led-dot"></span><span data-i18n="receiver.left"></span><select data-led="0"></select></label>
              <label><span class="led-dot"></span><span data-i18n="receiver.middle"></span><select data-led="1"></select></label>
              <label><span class="led-dot"></span><span data-i18n="receiver.right"></span><select data-led="2"></select></label>
            </div>
          </div>
        </div>

        <div id="tab-info" class="tab-body" hidden>
          <div class="card list">
            <div class="list-row" id="info-fw-row">
              <div>
                <div class="row-title" data-i18n="info.firmware"></div>
                <div class="muted small" id="info-fw"></div>
              </div>
              <button class="ghost" id="info-fw-update" data-i18n="info.firmwareUpdate"></button>
            </div>
            <div class="list-row" id="info-sn-row">
              <div>
                <div class="row-title" data-i18n="info.serial"></div>
                <div class="muted small selectable" id="info-sn"></div>
              </div>
              <button class="ghost" id="info-sn-copy" data-i18n="info.copy"></button>
            </div>
            <div class="list-row" id="info-pair-row">
              <div>
                <div class="row-title" data-i18n="info.pairing"></div>
                <div class="muted small" data-i18n="info.pairingHint"></div>
              </div>
              <button class="ghost" id="info-pair" data-i18n="info.pairingGuide"></button>
            </div>
          </div>
          <p class="muted small" data-i18n="info.firmwareHint"></p>
        </div>

        <div id="tab-eq" class="tab-body" hidden>
          <div class="card">
            <div class="card-head">
              <h2><span data-i18n="eq.title"></span><span class="info" tabindex="0" data-i18n-title="eq.more">i</span></h2>
              <div class="eq-presets">
                <select id="eq-preset" class="lang-select"></select>
                <input id="eq-preset-name" maxlength="40" data-i18n-placeholder="eq.presetName" hidden />
                <button id="eq-preset-save" class="ghost" data-i18n="eq.save"></button>
                <button id="eq-preset-delete" class="ghost" data-i18n="eq.delete"></button>
              </div>
            </div>
            <svg id="eq-curve" class="eq-curve" viewBox="0 0 600 140" preserveAspectRatio="none"></svg>
            <div class="eq-preamp">
              <span class="muted small" data-i18n="eq.preamp"></span>
              <input id="eq-preamp" type="range" min="-10" max="10" step="1" />
              <b class="accent"><span id="eq-preamp-val"></span> dB</b>
            </div>
            <div id="eq-bands" class="eq-bands"></div>
          </div>
        </div>

        <div id="tab-audio" class="tab-body" hidden>
          <div class="card list">
            <div class="list-row">
              <div>
                <div class="row-title"><span data-i18n="audio.format"></span><span class="info" tabindex="0" data-i18n-title="audio.formatMore">i</span></div>
                <div class="muted small" id="audio-format-hint" data-i18n="audio.formatHint"></div>
              </div>
              <select id="audio-format" class="lang-select"></select>
            </div>
            <div class="list-row">
              <div>
                <div class="row-title" data-i18n="audio.filter"></div>
                <div class="muted small" data-i18n="audio.filterHint"></div>
              </div>
              <select id="audio-filter" class="lang-select"></select>
            </div>
            <div class="list-row">
              <div>
                <div class="row-title" data-i18n="audio.highGain"></div>
                <div class="muted small" data-i18n="audio.highGainHint"></div>
              </div>
              <label class="switch"><input id="audio-gain" type="checkbox" /><i></i></label>
            </div>
            <div class="list-row">
              <div>
                <div class="row-title" data-i18n="audio.workMode"></div>
                <div class="muted small" data-i18n="audio.workModeHint"></div>
              </div>
              <div id="audio-mode" class="seg seg-small"></div>
            </div>
            <div class="list-row">
              <div>
                <div class="row-title" data-i18n="audio.mic"></div>
                <div class="muted small" data-i18n="audio.micHint"></div>
              </div>
              <span class="eq-preamp"><input id="audio-mic" type="range" min="-15" max="15" step="1" /><b class="accent"><span id="audio-mic-val"></span> dB</b></span>
            </div>
          </div>
        </div>

        <div id="tab-buttons" class="tab-body" hidden>
          <div class="card">
            <div class="card-head">
              <h2><span data-i18n="buttons.title"></span><span class="info" tabindex="0" data-i18n-title="buttons.more">i</span></h2>
              <div id="button-layer" class="seg seg-small"></div>
            </div>
            <p class="muted small" id="button-layer-hint"></p>
            <div id="button-list"></div>
          </div>
        </div>
      </section>

      <!-- Macros -->
      <section id="view-macros" class="view" hidden>
        <header class="device-head">
          <div>
            <div class="eyebrow" data-i18n="macros.eyebrow"></div>
            <h1><span data-i18n="macros.title"></span><span class="info" tabindex="0" data-i18n-title="macros.more">i</span></h1>
          </div>
        </header>
        <p class="muted small" data-i18n="macros.intro"></p>
        <div class="macros">
          <div class="macro-side">
            <div id="macro-list"></div>
            <button id="add-macro" class="ghost" data-i18n="macros.add"></button>
          </div>
          <div id="macro-edit" class="card" hidden>
            <div class="macro-top">
              <input id="macro-name" maxlength="32" data-i18n-title="macros.name" />
              <button id="macro-delete" class="ghost x" data-i18n-title="macros.delete">✕</button>
            </div>
            <div class="macro-opts">
              <label><span class="muted small" data-i18n="macros.mode"></span><select id="macro-mode"></select></label>
              <label id="macro-count-row"><span class="muted small" data-i18n="macros.count"></span><input id="macro-count" type="number" min="1" max="999" /></label>
            </div>
            <div class="card-head sub-head">
              <h3 data-i18n="macros.steps"></h3>
              <div class="row-actions">
                <label class="check"><input id="record-moves" type="checkbox" /> <span data-i18n="macros.recordMoves"></span></label>
                <button id="macro-record" class="ghost"></button>
              </div>
            </div>
            <p id="macro-recording" class="small accent" data-i18n="macros.recording" hidden></p>
            <div id="macro-steps"></div>
            <div class="row macro-add">
              <button id="add-key" class="ghost" data-i18n="macros.addKey"></button>
              <select id="add-mouse" class="ghost"></select>
            </div>
          </div>
          <div id="macro-none" class="empty" hidden><p class="muted" data-i18n="macros.none"></p></div>
        </div>
      </section>

      <!-- Scenes -->
      <section id="view-scenes" class="view" hidden>
        <header class="device-head">
          <div>
            <div class="eyebrow" data-i18n="auto.eyebrow"></div>
            <h1><span data-i18n="auto.title"></span><span class="info" tabindex="0" data-i18n-title="auto.more">i</span></h1>
          </div>
        </header>
        <p class="muted small" data-i18n="auto.intro"></p>
        <div class="status-line">
          <span class="dot"></span>
          <span id="auto-status" class="muted">—</span>
        </div>

        <div class="card">
          <div class="card-head">
            <div>
              <h2><span data-i18n="smart.title"></span><span class="info" tabindex="0" data-i18n-title="smart.more">i</span></h2>
              <p class="muted small" data-i18n="smart.intro"></p>
            </div>
            <label class="switch"><input id="smart-on" type="checkbox" /><i></i></label>
          </div>
          <div id="smart-body">
            <div class="smart-grid">
              <label><span class="muted small" data-i18n="smart.gameRate"></span><select id="game-rate"></select></label>
              <label><span class="muted small" data-i18n="smart.normalRate"></span><select id="normal-rate"></select></label>
            </div>
            <div class="card-head sub-head">
              <h3><span data-i18n="smart.exceptions"></span><span class="info" tabindex="0" data-i18n-title="smart.exceptionsHint">i</span></h3>
              <button id="add-exception" class="ghost" data-i18n="smart.add"></button>
            </div>
            <div id="exceptions"></div>
          </div>
        </div>

        <div class="section-head">
          <div>
            <h2><span data-i18n="scenes.title"></span><span class="info" tabindex="0" data-i18n-title="scenes.more">i</span></h2>
            <p class="muted small" data-i18n="scenes.intro"></p>
          </div>
          <label class="switch"><input id="scenes-on" type="checkbox" /><i></i></label>
        </div>
        <div id="scene-list"></div>
        <button id="add-scene" class="ghost" data-i18n="scenes.add"></button>
      </section>

      <!-- Settings -->
      <section id="view-settings" class="view" hidden>
        <header class="device-head">
          <div><div class="eyebrow">OpenSynapse</div><h1 data-i18n="settings.title"></h1></div>
        </header>
        <div class="card list">
          <div class="list-row">
            <div>
              <div class="row-title" data-i18n="settings.language"></div>
              <div class="muted small" data-i18n="settings.languageHint"></div>
            </div>
            <select id="language" class="lang-select"></select>
          </div>
          <div class="list-row">
            <div>
              <div class="row-title" data-i18n="settings.glass"></div>
              <div class="muted small" id="glass-hint"></div>
            </div>
            <label class="switch"><input id="glass" type="checkbox" /><i></i></label>
          </div>
          <div class="list-row">
            <div>
              <div class="row-title" data-i18n="settings.autostart"></div>
              <div class="muted small" data-i18n="settings.autostartHint"></div>
            </div>
            <label class="switch"><input id="autostart" type="checkbox" /><i></i></label>
          </div>
          <div class="list-row">
            <div>
              <div class="row-title"><span data-i18n="settings.notify"></span><span class="info" tabindex="0" data-i18n-title="settings.notifyMore">i</span></div>
              <div class="muted small" data-i18n="settings.notifyHint"></div>
            </div>
            <label class="switch"><input id="notify" type="checkbox" /><i></i></label>
          </div>
          <div class="list-row">
            <div>
              <div class="row-title" data-i18n="settings.dpiDisplay"></div>
              <div class="muted small" data-i18n="settings.dpiDisplayHint"></div>
            </div>
            <label class="switch"><input id="dpi-display" type="checkbox" /><i></i></label>
          </div>
        </div>
        <div class="card list" id="sound-card" hidden></div>
        <div class="card list">
          <div class="list-row">
            <div>
              <div class="row-title" data-i18n="backup.title"></div>
              <div class="muted small" data-i18n="backup.hint"></div>
            </div>
            <div class="row-actions">
              <button id="import" class="ghost" data-i18n="backup.import"></button>
              <button id="export" class="ghost" data-i18n="backup.export"></button>
            </div>
          </div>
        </div>
      </section>

      <!-- About -->
      <section id="view-about" class="view about" hidden>
        <header class="about-hero">
          <img class="about-logo" src="/logo.png" alt="" />
          <h1>OpenSynapse</h1>
          <div class="about-version">
            <span id="about-version"></span>
            <span class="pill" id="about-edition"></span>
          </div>
          <p class="muted" data-i18n="about.tagline"></p>
        </header>

        <div class="card list">
          <div class="list-row">
            <div>
              <div class="row-title" id="update-title"></div>
              <div class="muted small" id="update-status"></div>
            </div>
            <button id="update-check" class="ghost" data-i18n="update.check"></button>
          </div>
          <div class="list-row">
            <div>
              <div class="row-title" data-i18n="update.auto"></div>
              <div class="muted small" data-i18n="update.autoHint"></div>
            </div>
            <label class="switch"><input id="auto-update" type="checkbox" /><i></i></label>
          </div>
        </div>

        <nav class="about-links">
          <button class="link" data-link="repo">
            <svg viewBox="0 0 24 24"><path d="M9 19c-4 1.5-4-2-6-2.5M15 21v-3.5a3 3 0 0 0-.9-2.3c2.9-.3 6-1.4 6-6.4a5 5 0 0 0-1.4-3.5 4.6 4.6 0 0 0-.1-3.5s-1.1-.3-3.6 1.4a12.3 12.3 0 0 0-6.4 0C6.1 1.5 5 1.8 5 1.8a4.6 4.6 0 0 0-.1 3.5A5 5 0 0 0 3.5 8.8c0 5 3.1 6.1 6 6.4a3 3 0 0 0-.9 2.3V21" /></svg>
            <span>GitHub</span>
          </button>
          <button class="link" data-link="changelog">
            <svg viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9zM14 3v6h6M8 13h8M8 17h5" /></svg>
            <span data-i18n="about.changelog"></span>
          </button>
          <button class="link" data-link="issues">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M12 8v5M12 16h.01" /></svg>
            <span data-i18n="about.issues"></span>
          </button>
          <button class="link" data-link="license">
            <svg viewBox="0 0 24 24"><path d="M12 3v18M5 7h14M3 14l2-7 2 7a2 2 0 0 1-4 0zM17 14l2-7 2 7a2 2 0 0 1-4 0zM8 21h8" /></svg>
            <span data-i18n="about.license"></span>
          </button>
        </nav>

        <footer class="about-foot muted small">
          <p data-i18n="about.notice"></p>
          <p id="about-credits" data-i18n="about.credits"></p>
          <p data-i18n="about.remap"></p>
          <p>© 2026 JohnsonRan · GPL-2.0-or-later</p>
        </footer>
      </section>
    </main>
