name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: windows-latest # the HID code is Windows only
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3, for the requirements check
      - run: bun install --frozen-lockfile
      - run: scripts/check.sh # the same checks as locally; see REQUIREMENTS.md, "Commands"
        shell: bash
