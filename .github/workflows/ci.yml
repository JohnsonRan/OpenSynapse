name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call: # release.yml runs this gate on the tagged commit before it publishes

jobs:
  test:
    runs-on: windows-latest # the HID code is Windows only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3, for the requirements check
      - run: bun install --frozen-lockfile
      - run: scripts/check.sh # the same checks as locally; see REQUIREMENTS.md, "Commands"
        shell: bash
