name: Release

# Push a tag v<version of package.json> to build, sign and publish a release:
# the installer, the portable zip, and the signed update files that installed
# and portable copies update from.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the release, and the uploads to it

jobs:
  draft-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the version
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .version package.json)"
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "OpenSynapse $GITHUB_REF_NAME" --generate-notes
          fi

  build:
    needs: draft-release
    # Windows: generating the bindings builds the app for the host, and the app
    # is Windows only. mygo build downloads NSIS itself.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run build:web # the app embeds the built page
      - run: go vet ./...
      - run: go test ./...
      - name: Build and upload the installer and the update files
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: bun run build -- -platform windows/amd64 -upload
      # The portable version is the executable and a "portable" marker, which
      # keeps the settings in its folder. Updates replace only the executable.
      - name: Upload the portable zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          zip_name="opensynapse-${version}-windows-amd64-portable.zip"
          mkdir -p portable/OpenSynapse
          cp build/windows-amd64/OpenSynapse.exe portable/OpenSynapse/
          cp LICENSE LICENSES/GPL-3.0.txt portable/OpenSynapse/
          touch portable/OpenSynapse/portable
          (cd portable && 7z a -tzip "../$zip_name" OpenSynapse)
          gh release upload "$GITHUB_REF_NAME" "$zip_name" LICENSES/GPL-3.0.txt --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release, which installed copies then update to
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
